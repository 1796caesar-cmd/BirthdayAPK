plugins { id 'com.android.application' }
android {
 namespace 'ua.malinapk.birthdays'
 compileSdk 35
 defaultConfig {
  applicationId 'ua.malinapk.birthdays'
  minSdk 26
  targetSdk 35
  versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
  versionName = '1.0'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { if (System.getenv('BIRTHDAY_KEYSTORE')) { storeFile file(System.getenv('BIRTHDAY_KEYSTORE')); storePassword System.getenv('BIRTHDAY_STORE_PASSWORD'); keyAlias System.getenv('BIRTHDAY_KEY_ALIAS'); keyPassword System.getenv('BIRTHDAY_KEY_PASSWORD') } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
