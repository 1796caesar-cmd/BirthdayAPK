name: Build Birthday APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: birthday-apk-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not found}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIRTHDAY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BIRTHDAY_KEYSTORE_BASE64 is not configured. Add the permanent signing key before publishing."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/birthday.jks"
          echo "BIRTHDAY_KEYSTORE=$RUNNER_TEMP/birthday.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          BIRTHDAY_STORE_PASSWORD: ${{ secrets.BIRTHDAY_STORE_PASSWORD }}
          BIRTHDAY_KEY_ALIAS: ${{ secrets.BIRTHDAY_KEY_ALIAS }}
          BIRTHDAY_KEY_PASSWORD: ${{ secrets.BIRTHDAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BIRTHDAY_STORE_PASSWORD BIRTHDAY_KEY_ALIAS BIRTHDAY_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BirthdayAPK.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not found}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify BirthdayAPK.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BirthdayAPK
          path: BirthdayAPK.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.${GITHUB_RUN_NUMBER}"
          # A re-run retains the same version and release. Never replace an existing published APK.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping the published APK."
            exit 0
          fi
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          MARK_LATEST=true
          if [[ "$LATEST" =~ ^v1\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            MARK_LATEST=false
          fi
          gh release create "$TAG" BirthdayAPK.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Іменинники АПК 1.${GITHUB_RUN_NUMBER}" \
            --notes "Автоматична збірка №${GITHUB_RUN_NUMBER}." --latest="$MARK_LATEST"
